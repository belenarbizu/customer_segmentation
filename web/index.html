<!DOCTYPE html>
<html>
<head>
    <title>Customer Segmentation</title>
</head>
<body>
    <h2>RFM Customer Segmentation</h2>

    <form action="/predict-form" method="post">
        <label>Recency:</label>
        <input type="number" name="recency" required><br><br>

        <label>Frequency:</label>
        <input type="number" name="frequency" required><br><br>

        <label>Monetary:</label>
        <input type="number" step="0.01" name="monetary" required><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if cluster is defined %}
        <hr>
        <h3>Prediction result</h3>
        <p><strong>Cluster:</strong> {{ cluster }}</p>
        <p><strong>Segment:</strong> {{ name }}</p>
    {% endif %}
</body>
</html>
