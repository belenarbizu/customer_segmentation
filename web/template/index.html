<!DOCTYPE html>
<html>
<head>
    <title>Customer Segmentation</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>RFM Customer Segmentation</h2>

        <form action="/predict-form" method="post">

            <div class="form-group">
                <label>Recency</label>
                <input type="number" name="recency" required>
            </div>

            <div class="form-group">
                <label>Frequency</label>
                <input type="number" name="frequency" required>
            </div>

            <div class="form-group">
                <label>Monetary</label>
                <input type="number" step="0.01" name="monetary" required>
            </div>

            <button type="submit">Predict</button>
        </form>

        {% if cluster is defined %}
            <div class="result">
                <h3>Prediction result</h3>
                <p><strong>Cluster:</strong> {{ cluster }}</p>
                <p><strong>Segment:</strong> {{ name }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
